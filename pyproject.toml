[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-bbva"
version = "0.1.0"
description = "Asistente RAG para BBVA Colombia (caso ficticio) sobre el contenido público de https://www.bancolombia.com/"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    # API REST del servicio RAG (M9).
    "fastapi>=0.115,<1",
    "httpx>=0.27",
    "lxml>=5.0",
    "numpy>=1.26",
    # SDK compatible con la API de xAI (Grok). Usa httpx2 como cliente HTTP.
    "openai>=3.24,<4",
    # Analítica del historial (M11).
    "pandas>=2.2,<4",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # Misma serie que la imagen qdrant/qdrant:v1.19.1 de docker-compose.yml.
    "qdrant-client>=1.19.1,<1.20",
    "sentence-transformers>=3.0",
    # Historial de conversaciones en SQLite (M8, patrón Repository).
    "sqlalchemy>=2.0,<2.2",
    # Interfaz web del chat (M10); consume la API por HTTP.
    "streamlit>=1.40,<2",
    "tenacity>=8.2",
    # CPU-only: instalar antes desde https://download.pytorch.org/whl/cpu (ver README).
    "torch>=2.4",
    "trafilatura>=2.0",
    "typer>=0.12",
    # Servidor ASGI para la API (comando `serve`, M9).
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
rag-bbva = "rag_bbva.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # El modo :memory: de qdrant-client (tests) avisa que los índices de payload no aplican.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
markers = [
    "integration: requiere servicios reales (Qdrant, API de xAI, red)",
    "slow: carga modelos pesados",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
